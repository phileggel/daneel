name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @anthropic-ai/claude-code plugin validate .
      - run: npx --yes @anthropic-ai/claude-code plugin validate plugins/flow
      # The sandbox's app (tests/test_sandbox_acme.py): `just`, and its packages from the lock file.
      - run: sudo apt-get update
      - run: sudo apt-get install --yes just
      - run: npm ci --prefix sandbox/acme
      - run: python3 -m unittest discover -s tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PROJECT_NAMES: ${{ vars.PROJECT_NAMES }}
