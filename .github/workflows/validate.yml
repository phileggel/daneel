name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # TEMPORARY, removed before this pull request merges: can a workflow's token, given
  # only `contents: read`, read an account's permission on the repository?
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_ACTOR/permission" --jq '"permission of the actor = " + .permission'
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/collaborators/octocat/permission" --jq '"permission of a stranger = " + .permission'

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @anthropic-ai/claude-code plugin validate .
      - run: npx --yes @anthropic-ai/claude-code plugin validate plugins/flow
      - run: python3 -m unittest discover -s tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PROJECT_NAMES: ${{ vars.PROJECT_NAMES }}
