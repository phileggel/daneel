[package]
name = "acme"
version = "0.1.0"
edition = "2021"

# The shell. `just harness` never builds it: the rules live in `core/`.
[lib]
name = "acme_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
acme-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
